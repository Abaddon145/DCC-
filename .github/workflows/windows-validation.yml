name: Windows validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend tests
        run: npm test -- --run
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Rust format
        working-directory: src-tauri
        run: cargo +stable fmt --all -- --check
      - name: Rust tests (no live service credentials)
        working-directory: src-tauri
        run: cargo +stable test --locked
      - name: Build test installer (not a release)
        run: npm run tauri -- build --bundles nsis
      - name: Installer checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | ForEach-Object {
            $digest = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            [System.IO.File]::WriteAllText($_.FullName + '.sha256', $digest.Hash.ToLowerInvariant() + '  ' + $_.Name + "`n")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-test-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/resources/THIRD_PARTY_NOTICES.md
            src-tauri/resources/THREE-LICENSE.txt
            src-tauri/resources/media-tools/FFMPEG-LICENSE.txt
            ue-tools/StackAssetBridge/KURA-LICENSE.txt
          retention-days: 14
