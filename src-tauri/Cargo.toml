[package]
name = "dcc-asset-library"
version = "0.8.0"
description = "Local DCC and Unreal Engine asset library"
authors = ["DCC Asset Library"]
edition = "2021"

[lib]
name = "dcc_asset_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
url = "2"
arboard = "3"
open = "5"
csv = "1"
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
reqwest = { version = "0.13", features = ["json", "form"] }
regex = "1"
md5 = "0.7"
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
pretty_assertions = "1"
