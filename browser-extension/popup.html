<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栈藏 · 网页采集</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span>STACK · WEB CAPTURE</span><h1>收集灵感，继续创作。</h1><p id="connection" role="status">正在连接栈藏…</p></header>
<main>
  <details id="setup"><summary>首次安装与连接</summary><p>首次连接请先从桌面或开始菜单打开栈藏，在“采集收件箱 → 连接浏览器”粘贴下面的扩展 ID。安装扩展本身不会自动完成连接。</p><code id="extension-id"></code><button id="copy-id">复制扩展 ID</button><button id="reconnect">重新检查连接</button><p>连接后回到此面板重新检查，再确认目标素材库，即可保存。更换扩展目录或重新加载后 ID 可能变化，需要再次连接。</p></details>
  <label class="confirm"><input type="checkbox" id="confirm">我确认将内容保存到上方素材库</label>
  <section class="tools"><button id="page-images">选择网页图片</button><button id="screenshot">区域截图</button><button id="page-link">保存页面链接</button></section>
  <div class="targets"><label>目标文件夹<select id="folder"><option value="">收件箱 · 暂不分类</option></select></label><label>关联创作项目<select id="project"><option value="">不关联</option></select></label></div>
  <label>标签<input id="tags" placeholder="分号分隔，例如：UE5;场景参考" maxlength="1000"></label>
  <div class="selection-head"><strong id="selected-count">尚未选择内容</strong><button id="select-all" class="quiet">全选 / 取消</button></div>
  <section id="items" aria-label="待采集内容"></section>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" aria-label="采集结果"></section>
</main>
<footer><button id="open-app" class="quiet">打开栈藏</button><button id="cancel" hidden>取消采集</button><button id="capture" class="primary" disabled>保存所选</button></footer>
<script type="module" src="popup.js"></script></body></html>
